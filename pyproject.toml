[project]
name = "transcript2script"
version = "0.1.0"
description = "Fetch YouTube transcripts and compile facts from the video."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "youtube-transcript-api>=1.0.0",
  "yt-dlp>=2024.8.0",
  "openai>=1.40.0",
  "python-dotenv>=1.0.0",
  "rich>=13.7.0",
  "typer>=0.12.0",
]

[project.scripts]
transcript2script = "transcript2script.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["transcript2script*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
